http {
  geo $blocked_ip {
     default 0;
     include /home/hwan/go_api_boilerplate/nginx/nginx-blocklist/ips.txt;

  }
  server{
     listen 80;
     server_name _;

     if ($block_ip) {
       return 403;
     }

     location / {
       proxy_pass http://app:8080;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
     }

}
