geo $geo {
      default 0;
      include /etc/nginx/ips.txt;
}

server{
     listen 80;
     server_name _;

     location / {

       if ($geo) {
           return 403;
       }        

       proxy_pass http://app:8080;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
     }
}
